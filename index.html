<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر التطبيق</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>
    <nav class="nav-bar">
        <button class="tab-btn active" onclick="switchTab('store')">المتجر</button>
        <button class="tab-btn" onclick="switchTab('about')">من نحن</button>
        <button class="tab-btn" onclick="switchTab('privacy')">الخصوصية</button>
        <button class="tab-btn" onclick="switchTab('terms')">الحقوق</button>
    </nav>

    <div id="store" class="tab-content active">
        <div id="productsGrid" class="grid"></div>
    </div>

    <div id="about" class="tab-content">
        <h2>من نحن</h2>
        <p>نحن منصة تكنولوجية حديثة لتقديم أفضل الخدمات البرمجية والتطبيقات.</p>
    </div>

    <div id="privacy" class="tab-content">
        <h2>سياسة الخصوصية</h2>
        <p>نحن نحترم خصوصيتك ولا نجمع بيانات شخصية بدون إذنك.</p>
    </div>

    <div id="terms" class="tab-content">
        <h2>حقوق الطبع والنشر</h2>
        <p>جميع الحقوق محفوظة. يمنع نسخ أي محتوى من هذا التطبيق.</p>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
